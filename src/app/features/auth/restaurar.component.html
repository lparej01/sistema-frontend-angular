<div class="contenedor-restaurar">
  <h2>Restablecer Contraseña</h2>
  <p>Ingresa tu nueva contraseña a continuación.</p>

  <form (ngSubmit)="cambiarPassword()">

    <!-- CAMPO 1: NUEVA CONTRASEÑA -->
    <div class="form-group" style="margin-bottom: 15px;">
      <label for="password" style="display: block; margin-bottom: 5px;">Nueva Contraseña:</label>
      <div style="position: relative; display: flex; align-items: center;">
        <input
          [type]="ocultarPassword ? 'password' : 'text'"
          id="password"
          [(ngModel)]="nuevaPassword"
          name="password"
          required
          minlength="8"
          placeholder="Mínimo 8 caracteres"
          style="width: 100%; padding: 10px; padding-right: 40px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;"
        />
        <div
          (click)="ocultarPassword = !ocultarPassword"
          style="position: absolute; right: 12px; cursor: pointer; color: #666; font-size: 1.2rem; display: flex; align-items: center; user-select: none;"
        >
          <i class="fa" [class.fa-eye-slash]="ocultarPassword" [class.fa-eye]="!ocultarPassword"></i>
        </div>
      </div>
    </div>

    <!-- CAMPO 2: CONFIRMAR CONTRASEÑA -->
    <div class="form-group" style="margin-bottom: 15px;">
      <label for="repetirPassword" style="display: block; margin-bottom: 5px;">Confirmar Nueva Contraseña:</label>
      <div style="position: relative; display: flex; align-items: center;">
        <input
          [type]="ocultarRepetirPassword ? 'password' : 'text'"
          id="repetirPassword"
          [(ngModel)]="repetirPassword"
          name="repetirPassword"
          required
          minlength="8"
          placeholder="Repite tu contraseña"
          style="width: 100%; padding: 10px; padding-right: 40px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;"
        />
        <div
          (click)="ocultarRepetirPassword = !ocultarRepetirPassword"
          style="position: absolute; right: 12px; cursor: pointer; color: #666; font-size: 1.2rem; display: flex; align-items: center; user-select: none;"
        >
          <i class="fa" [class.fa-eye-slash]="ocultarRepetirPassword" [class.fa-eye]="!ocultarRepetirPassword"></i>
        </div>
      </div>
    </div>

    <button type="submit" style="width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 15px; font-weight: bold;">
      Guardar Nueva Contraseña
    </button>
  </form>
</div>
